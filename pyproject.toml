[project]
name = "remote-job-pipeline"
version = "0.1.0"
description = "ETL pipeline for remote Data Engineer jobs, filtered for eligibility from Indonesia."
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP042"]  # str+Enum kept intentionally for JSON/psycopg serialization compatibility

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
